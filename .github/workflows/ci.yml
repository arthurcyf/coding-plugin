name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: tests (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Unit tests
        env:
          CODING_PLUGIN_STRICT: "1"
        run: python -m unittest discover -s tests -t tests -v

  # Oldest supported Python (the macOS system python3). setup-python has no 3.9 build for
  # current Ubuntu runners, so use the official image, which still ships 3.9 and git.
  test-py39:
    name: tests (python:3.9 container)
    runs-on: ubuntu-latest
    container: python:3.9-bookworm
    steps:
      - uses: actions/checkout@v4
      - name: Unit tests
        env:
          CODING_PLUGIN_STRICT: "1"
        run: python -m unittest discover -s tests -t tests -v

  generated-in-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Generated adapter files match core/
        run: python build/generate.py --check
      - name: CHANGELOG has an entry for VERSION
        run: grep -q "^## \[$(cat VERSION)\]" CHANGELOG.md
