# coding-plugin CI gate: the same secret scan and check command that the agent and git hooks use.
name: coding-plugin

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # {{stack-setup}}
      - name: Secret scan and project checks
        env:
          CI: "true"
        run: python3 .coding-plugin/bin/coding_plugin.py ci
